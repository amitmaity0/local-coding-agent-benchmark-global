[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "motionforge"
version = "0.1.0"
description = "AI video optimization orchestrator"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "jinja2>=3.1.2",
    "htmx>=0.1.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "uvicorn>=0.29.0",
    "loguru>=0.7.0",
    "pyyaml>=6.0",
]

[project.scripts]
motionforge = "motionforge.web.app:main"

[tool.setuptools.packages.find]
include = ["orchestrator*", "services*", "web*", "configs*", "workflows*", "experiments*", "tests*"]